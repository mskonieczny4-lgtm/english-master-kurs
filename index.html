<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Master | Pełny Kurs M1-M5 (Naprawiony)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .card-flip { perspective: 1000px; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; position: relative; width: 100%; height: 100%; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { 
            backface-visibility: hidden; position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; 
            padding: 15px; border-radius: 16px; text-align: center;
        }
        .card-back { transform: rotateY(180deg); background-color: #2563eb; color: white; font-weight: bold; }
        .card-front { background-color: #f8fafc; border: 2px solid #e2e8f0; color: #1e293b; font-style: italic; }
        .gradient-header { background: linear-gradient(135deg, #1e3a8a 0%, #4338ca 100%); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="gradient-header text-white p-6 shadow-lg sticky top-0 z-50">
    <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-3xl font-800 tracking-tighter">ENGLISH MASTER</h1>
            <p class="text-blue-200 text-sm font-semibold uppercase tracking-widest">30 Lekcji • Moduły 1 - 5</p>
        </div>
        <div class="bg-white/10 px-4 py-2 rounded-xl border border-white/20">
            <span id="progressCount" class="text-xl font-bold">0</span> <span class="text-sm opacity-70">/ 30 ukończonych lekcji</span>
        </div>
    </div>
</header>

<main class="container mx-auto p-4 lg:p-8">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <aside class="lg:col-span-1 space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <label class="block text-slate-700 font-bold mb-3 italic">Wybierz Moduł i Lekcję:</label>
                <select id="lessonSelect" class="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-indigo-500 outline-none transition-all" onchange="loadLesson()">
                    <optgroup label="M1: Podstawy">
                        <option value="M1L1">L1: Powitania</option>
                        <option value="M1L2">L2: Przedstawianie się</option>
                        <option value="M1L3">L3: Liczby 1-10</option>
                        <option value="M1L4">L4: Kolory</option>
                        <option value="M1L5">L5: Rodzina</option>
                        <option value="M1L6">L6: Samopoczucie</option>
                    </optgroup>
                    <optgroup label="M2: Życie Codzienne">
                        <option value="M2L1">L1: Mój Dom</option>
                        <option value="M2L2">L2: Jedzenie</option>
                        <option value="M2L3">L3: Czas wolny</option>
                        <option value="M2L4">L4: Zawody</option>
                        <option value="M2L5">L5: Zegar i Czas</option>
                        <option value="M2L6">L6: Codzienna Rutyna</option>
                    </optgroup>
                    <optgroup label="M3: Zakupy">
                        <option value="M3L1">L1: Sklep spożywczy</option>
                        <option value="M3L2">L2: Ubrania</option>
                        <option value="M3L3">L3: Liczby 20+ i Ceny</option>
                        <option value="M3L4">L4: Elektronika</option>
                        <option value="M3L5">L5: Płatności</option>
                        <option value="M3L6">L6: Reklamacje</option>
                    </optgroup>
                    <optgroup label="M4: Podróże">
                        <option value="M4L1">L1: Lotnisko</option>
                        <option value="M4L2">L2: Transport</option>
                        <option value="M4L3">L3: Kierunki i Orientacja</option>
                        <option value="M4L4">L4: Hotel i Nocleg</option>
                        <option value="M4L5">L5: Kontakt telefoniczny</option>
                        <option value="M4L6">L6: Planowanie i Czas</option>
                    </optgroup>
                    <optgroup label="M5: Biznes i Praca">
                        <option value="M5L1">L1: Biuro i Zespół</option>
                        <option value="M5L2">L2: Kalendarz i Spotkania</option>
                        <option value="M5L3">L3: Oferty i Kontrakty</option>
                        <option value="M5L4">L4: E-maile i Wiadomości</option>
                        <option value="M5L5">L5: Strategia i Cele</option>
                        <option value="M5L6">L6: Rozwiązywanie Problemów</option>
                    </optgroup>
                </select>
            </div>

            <div class="bg-indigo-900 text-white p-6 rounded-2xl shadow-lg">
                <h3 class="font-bold mb-4 flex items-center"><span class="mr-2">🎧</span> Odtwarzacz</h3>
                <div class="space-y-4">
                    <div>
                        <p class="text-[10px] font-bold opacity-60 uppercase mb-1">Słownictwo (Vocabulary)</p>
                        <audio id="audioVocab" controls class="w-full h-8"></audio>
                    </div>
                    <div>
                        <p class="text-[10px] font-bold opacity-60 uppercase mb-1">Powtórki (Repeat)</p>
                        <audio id="audioRepeat" controls class="w-full h-8"></audio>
                    </div>
                </div>
            </div>
        </aside>

        <section class="lg:col-span-3">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 min-h-[500px]">
                <div class="flex justify-between items-center mb-8 pb-4 border-b border-slate-100">
                    <div>
                        <span id="lessonTag" class="text-indigo-600 font-bold text-xs uppercase tracking-widest">Moduł 5</span>
                        <h2 id="lessonTitle" class="text-3xl font-800 text-slate-900">Biuro i Zespół</h2>
                    </div>
                </div>
                <div id="contentArea" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
                    </div>
            </div>
        </section>
    </div>
</main>

<script>
    const lessonsData = {
        // MODUŁ 1-3 (Standardowe dane)
        "M1L1": { title: "Powitania", tag: "Moduł 1", vocab: ["Hello - Cześć", "Good morning - Dzień dobry", "Goodbye - Do widzenia", "How are you? - Jak się masz?"], files: {v: "M1L1_Vocabulary_1.mp3", r: "M1L1_Repeat_1.mp3"} },
        // ... (dodaj pozostałe M1-M3)

        // MODUŁ 4 (Poprawiony pod pliki audio)
        "M4L3": { title: "Kierunki i Orientacja", tag: "Moduł 4", vocab: ["Street - Ulica", "Left/Right - Lewo/Prawo", "Straight ahead - Prosto przed siebie", "Corner - Róg", "Map - Mapa", "Near/Far - Blisko/Daleko"], files: {v: "M4L3_Vocabulary_1.mp3", r: "M4L3_Repeat_1.mp3"} },
        "M4L4": { title: "Hotel i Nocleg", tag: "Moduł 4", vocab: ["Hotel - Hotel", "Room - Pokój", "Reservation - Rezerwacja", "Passport - Paszport", "Key - Klucz", "Luggage - Bagaż"], files: {v: "M4L4_Vocabulary_1.mp3", r: "M4L4_Repeat_1.mp3"} },
        "M4L5": { title: "Kontakt telefoniczny", tag: "Moduł 4", vocab: ["Phone - Telefon", "Call - Dzwonić", "Message - Wiadomość", "Signal - Zasięg", "Answer - Odpowiedzieć", "Busy - Zajęty"], files: {v: "M4L5_Vocabulary_1.mp3", r: "M4L5_Repeat_1.mp3"} },
        "M4L6": { title: "Planowanie i Czas", tag: "Moduł 4", vocab: ["Meeting - Spotkanie", "Plan - Plan", "Time - Czas", "Date - Data", "Tomorrow - Jutro", "Schedule - Harmonogram"], files: {v: "M4L6_Vocabulary_1.mp3", r: "M4L6_Repeat_1.mp3"} },

        // MODUŁ 5 (Zaktualizowany całkowicie pod Twoje pliki BIZNESOWE)
        "M5L1": { title: "Biuro i Zespół", tag: "Moduł 5", vocab: ["Job/Work - Praca", "Company - Firma", "Office - Biuro", "Manager - Kierownik", "Team - Zespół", "Experience - Doświadczenie", "Colleague - Współpracownik"], files: {v: "M5L1_Vocabulary_1.mp3", r: "M5L1_Repeat_1.mp3"} },
        "M5L2": { title: "Kalendarz i Spotkania", tag: "Moduł 5", vocab: ["Client - Klient", "Calendar - Kalendarz", "Appointment - Umówione spotkanie", "Available - Dostępny", "Invite - Zaproszenie", "Confirm - Potwierdzić", "Agenda - Plan spotkania"], files: {v: "M5L2_Vocabulary_1.mp3", r: "M5L2_Repeat_1.mp3"} },
        "M5L3": { title: "Oferty i Kontrakty", tag: "Moduł 5", vocab: ["Offer - Oferta", "Service - Usługa", "Question - Pytanie", "Details - Szczegóły", "Solution - Rozwiązanie", "Contract - Umowa", "Price - Cena", "Deadline - Termin ostateczny"], files: {v: "M5L3_Vocabulary_1.mp3", r: "M5L3_Repeat_1.mp3"} },
        "M5L4": { title: "E-maile i Wiadomości", tag: "Moduł 5", vocab: ["Email - E-mail", "Subject - Temat", "Reply - Odpowiedź", "Attachment - Załącznik", "Message - Wiadomość", "Request - Prośba", "Information - Informacja", "Send/Receive - Wysłać/Otrzymać"], files: {v: "M5L4_Vocabulary_1.mp3", r: "M5L4_Repeat_1.mp3"} },
        "M5L5": { title: "Strategia i Cele", tag: "Moduł 5", vocab: ["Idea - Pomysł", "Presentation - Prezentacja", "Benefit - Korzyść", "Result - Wynik", "Strategy - Strategia", "Goal - Cel", "Value - Wartość"], files: {v: "M5L5_Vocabulary_1.mp3", r: "M5L5_Repeat_1.mp3"} },
        "M5L6": { title: "Rozwiązywanie Problemów", tag: "Moduł 5", vocab: ["Problem/Solution - Rozwiązanie problemu", "Issue - Kwestia/Sprawa", "Step - Krok", "Task - Zadanie", "Priority - Priorytet", "Update - Aktualizacja", "Support - Wsparcie", "Progress - Postęp"], files: {v: "M5L6_Vocabulary_1.mp3", r: "M5L6_Repeat_1.mp3"} },
    };

    let completed = new Set();

    function loadLesson() {
        const id = document.getElementById('lessonSelect').value;
        const data = lessonsData[id] || { title: "W opracowaniu", tag: "-", vocab: [], files: {v:"", r:""} };
        
        document.getElementById('lessonTitle').innerText = data.title;
        document.getElementById('lessonTag').innerText = data.tag;
        document.getElementById('audioVocab').src = data.files.v;
        document.getElementById('audioRepeat').src = data.files.r;

        const container = document.getElementById('contentArea');
        container.innerHTML = '';
        data.vocab.forEach(item => {
            const [en, pl] = item.split(' - ');
            container.innerHTML += `
                <div class="card-flip h-32">
                    <div class="card-inner" onclick="this.classList.toggle('flipped'); trackProgress('${id}')">
                        <div class="card-front font-semibold">${en}</div>
                        <div class="card-back">${pl}</div>
                    </div>
                </div>
            `;
        });
    }

    function trackProgress(id) {
        completed.add(id);
        document.getElementById('progressCount').innerText = completed.size;
    }

    window.onload = loadLesson;
</script>
</body>
</html>
