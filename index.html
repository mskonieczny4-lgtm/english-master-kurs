<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Master | Pełny Kurs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
    .gradient-header { background: linear-gradient(135deg, #0f172a 0%, #312e81 100%); }
    .tab-btn.active {
      background: #0f172a;
      color: white;
      border-color: #0f172a;
    }
    .lesson-btn.active {
      background: #eef2ff;
      border-color: #6366f1;
      color: #312e81;
    }
    .audio-card.done {
      border-color: #10b981;
      background: #ecfdf5;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="gradient-header text-white p-6 shadow-lg sticky top-0 z-50">
  <div class="container mx-auto flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
    <div>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">ENGLISH MASTER</h1>
      <p class="text-blue-200 text-sm font-semibold uppercase tracking-[0.2em] mt-1">
        5 modułów • 30 lekcji • kurs audio
      </p>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
      <input
        type="text"
        id="searchInput"
        placeholder="Szukaj: podróże, biznes, M4L2..."
        oninput="filterLessons()"
        class="px-4 py-3 rounded-2xl text-slate-900 text-sm w-full sm:w-80 focus:outline-none focus:ring-2 focus:ring-blue-300"
      />
      <div class="bg-white/10 px-5 py-3 rounded-2xl border border-white/20 min-w-[180px]">
        <div class="text-[11px] uppercase tracking-widest opacity-70">Ukończone lekcje</div>
        <div class="mt-1">
          <span id="progressCount" class="text-2xl font-extrabold">0</span>
          <span class="opacity-80">/ 30</span>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="container mx-auto p-4 lg:p-8">
  <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">

    <aside class="xl:col-span-1 space-y-6">
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-500 uppercase mb-4 tracking-wider">Moduły i lekcje</h3>

        <div class="mb-4">
          <select
            id="moduleSelect"
            class="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 outline-none transition-all font-medium"
            onchange="renderLessonButtons(); loadLesson(currentLessonId)"
          >
            <option value="1">Moduł 1: Podstawy</option>
            <option value="2">Moduł 2: Życie codzienne</option>
            <option value="3">Moduł 3: Zakupy</option>
            <option value="4">Moduł 4: Podróże</option>
            <option value="5">Moduł 5: Praca i biznes</option>
          </select>
        </div>

        <div id="lessonButtons" class="grid grid-cols-2 gap-2"></div>
      </div>

      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-500 uppercase mb-4 tracking-wider">Sterowanie</h3>
        <div class="grid grid-cols-1 gap-3">
          <button onclick="prevLesson()" class="w-full px-4 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold transition">
            ← Poprzednia lekcja
          </button>
          <button onclick="nextLesson()" class="w-full px-4 py-3 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition">
            Następna lekcja →
          </button>
          <button onclick="markLessonComplete()" class="w-full px-4 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold transition">
            ✓ Oznacz jako ukończoną
          </button>
          <button onclick="resetProgress()" class="w-full px-4 py-3 rounded-2xl bg-rose-100 hover:bg-rose-200 text-rose-700 font-semibold transition">
            Reset postępu
          </button>
        </div>
      </div>

      <div class="bg-indigo-900 text-white p-6 rounded-3xl shadow-lg">
        <h3 class="font-bold mb-4 flex items-center text-lg">
          <span class="mr-2">🎵</span> Główny odtwarzacz
        </h3>

        <div class="bg-white/10 p-4 rounded-2xl">
          <p id="mainAudioLabel" class="text-sm font-semibold mb-3">Wybierz nagranie z lekcji</p>
          <audio id="mainAudioPlayer" controls class="w-full"></audio>
        </div>
      </div>
    </aside>

    <section class="xl:col-span-3 space-y-6">
      <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
        <div class="flex flex-col lg:flex-row lg:justify-between lg:items-center gap-4 mb-8 pb-6 border-b border-slate-100">
          <div>
            <span id="lessonTag" class="text-indigo-600 font-bold text-xs uppercase tracking-widest bg-indigo-50 px-3 py-1 rounded-full inline-block mb-3">
              Moduł 1: Podstawy
            </span>
            <h2 id="lessonTitle" class="text-3xl md:text-4xl font-extrabold text-slate-900">Powitania</h2>
            <p id="lessonDescription" class="text-slate-600 mt-3 max-w-3xl">
              Nauka zwrotów powitalnych i pożegnalnych.
            </p>
          </div>

          <div class="flex flex-wrap gap-3">
            <button id="tabLesson" onclick="setTab('lesson')" class="tab-btn active px-4 py-3 rounded-2xl border border-slate-200 font-semibold text-slate-800 transition">
              Lekcja
            </button>
            <button id="tabAudio" onclick="setTab('audio')" class="tab-btn px-4 py-3 rounded-2xl border border-slate-200 font-semibold text-slate-800 transition">
              Nagrania
            </button>
            <button id="tabInfo" onclick="setTab('info')" class="tab-btn px-4 py-3 rounded-2xl border border-slate-200 font-semibold text-slate-800 transition">
              Informacje
            </button>
          </div>
        </div>

        <div id="contentArea"></div>
      </div>
    </section>
  </div>
</main>

    { key: "Vocabulary", label: "Vocabulary", color: "blue" },
    { key: "KeyPhrases", label: "Key Phrases", color: "fuchsia" },

    { key: "Repeat", label: "Repeat", color: "amber" },
    { key: "Questions", label: "Questions", color: "violet" }
  ];

  const lessonOrder = [];
  for (let module = 1; module <= 5; module++) {
    for (let lesson = 1; lesson <= 6; lesson++) {
      lessonOrder.push(`M${module}L${lesson}`);
    }
  }

  let currentLessonId = "M1L1";
  let currentTab = "lesson";
  let completedLessons = JSON.parse(localStorage.getItem("englishMasterCompletedLessons") || "[]");

  function getAudioFile(lessonId, typeKey) {
    return `audio/${lessonId}_${typeKey}_1.mp3`;
  }

  function getModuleFromLessonId(lessonId) {
    return Number(lessonId.match(/^M(\d)L(\d)$/)[1]);
  }

  function updateProgress() {
    document.getElementById("progressCount").innerText = completedLessons.length;
  }

  function saveProgress() {
    localStorage.setItem("englishMasterCompletedLessons", JSON.stringify(completedLessons));
    updateProgress();
    renderLessonButtons();
  }

  function markLessonComplete() {
    if (!completedLessons.includes(currentLessonId)) {
      completedLessons.push(currentLessonId);
      saveProgress();
      alert(`Oznaczono ${currentLessonId} jako ukończoną.`);
    } else {
      alert(`Ta lekcja jest już oznaczona jako ukończona.`);
    }
  }

  function resetProgress() {
    if (confirm("Na pewno chcesz wyzerować cały postęp?")) {
      completedLessons = [];
      saveProgress();
    }
  }

  function renderLessonButtons() {
    const selectedModule = Number(document.getElementById("moduleSelect").value);
    const container = document.getElementById("lessonButtons");
    container.innerHTML = "";

    for (let lesson = 1; lesson <= 6; lesson++) {
      const lessonId = `M${selectedModule}L${lesson}`;
      const isActive = lessonId === currentLessonId;
      const isDone = completedLessons.includes(lessonId);

      const button = document.createElement("button");
      button.className = `lesson-btn px-3 py-3 rounded-2xl border font-semibold text-sm transition ${
        isActive ? "active" : "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100"
      }`;
      button.innerHTML = `${lessonId}${isDone ? " ✓" : ""}`;
      button.onclick = () => loadLesson(lessonId);
      container.appendChild(button);
    }
  }

  function setTab(tab) {
    currentTab = tab;
    document.getElementById("tabLesson").classList.toggle("active", tab === "lesson");
    document.getElementById("tabAudio").classList.toggle("active", tab === "audio");
    document.getElementById("tabInfo").classList.toggle("active", tab === "info");
    renderContent();
  }

  function loadLesson(lessonId = null) {
    if (lessonId) currentLessonId = lessonId;

    const moduleNo = getModuleFromLessonId(currentLessonId);
    const lessonInfo = courseData[currentLessonId];

    document.getElementById("moduleSelect").value = String(moduleNo);
    document.getElementById("lessonTag").innerText = lessonInfo.module;
    document.getElementById("lessonTitle").innerText = lessonInfo.title;
    document.getElementById("lessonDescription").innerText = lessonInfo.description;

    renderLessonButtons();
    renderContent();
  }

  function renderLessonContent(lessonInfo) {
    return `
      <div class="space-y-6">
        <div class="bg-slate-50 border border-slate-200 rounded-3xl p-6">
          <h3 class="text-xl font-bold text-slate-900 mb-3">O czym jest ta lekcja</h3>
          <p class="text-slate-700 leading-relaxed">${lessonInfo.description}</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-white border border-slate-200 rounded-3xl p-6">
            <h3 class="text-xl font-bold text-slate-900 mb-4">Czego się nauczysz</h3>
            <ul class="space-y-3 text-slate-700">
              ${lessonInfo.learn.map(item => `<li class="flex items-start gap-3"><span class="mt-1 text-indigo-600">•</span><span>${item}</span></li>`).join("")}
            </ul>
          </div>

          <div class="bg-white border border-slate-200 rounded-3xl p-6">
            <h3 class="text-xl font-bold text-slate-900 mb-4">Zakres lekcji</h3>
            <div class="flex flex-wrap gap-3">
              ${lessonInfo.scope.map(item => `<span class="px-3 py-2 rounded-2xl bg-indigo-50 text-indigo-700 font-medium text-sm">${item}</span>`).join("")}
            </div>
          </div>
        </div>

        <div class="bg-blue-50 border border-blue-200 rounded-3xl p-6">
          <h3 class="text-xl font-bold text-slate-900 mb-3">Jak pracować z lekcją</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-slate-700">
            <div class="bg-white rounded-2xl p-4 border border-blue-100">
              <div class="font-bold mb-2">1. Vocabulary</div>
              <p class="text-sm">Najpierw odsłuchaj podstawowe słownictwo i oswój wymowę.</p>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-blue-100">
              <div class="font-bold mb-2">2. Key Phrases / Dialogue</div>
              <p class="text-sm">Potem przejdź do kluczowych zwrotów i dialogu w kontekście.</p>
            </div>
            <div class="bg-white rounded-2xl p-4 border border-blue-100">
              <div class="font-bold mb-2">3. Repeat / Questions</div>
              <p class="text-sm">Na końcu utrwal materiał powtórką i pytaniami.</p>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function renderInfoContent(lessonInfo) {
    return `
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-slate-50 border border-slate-200 rounded-3xl p-6">
          <h3 class="text-xl font-bold text-slate-900 mb-3">Informacje o lekcji</h3>
          <div class="space-y-2 text-slate-700">
            <p><strong>Moduł:</strong> ${lessonInfo.module}</p>
            <p><strong>Lekcja:</strong> ${lessonInfo.title}</p>
            <p><strong>ID:</strong> ${currentLessonId}</p>
            <p><strong>Status:</strong> ${completedLessons.includes(currentLessonId) ? "Ukończona" : "Nieukończona"}</p>
          </div>
        </div>

        <div class="bg-slate-50 border border-slate-200 rounded-3xl p-6">
          <h3 class="text-xl font-bold text-slate-900 mb-3">Dostępne nagrania</h3>
          <ul class="space-y-2 text-slate-700">
            <li>• Vocabulary</li>
            <li>• Key Phrases</li>
            <li>• Dialogue</li>
            <li>• Repeat</li>
            <li>• Questions</li>
          </ul>
        </div>
      </div>
    `;
  }

  function renderAudioContent() {
    const wrapper = document.createElement("div");
    wrapper.className = "grid grid-cols-1 md:grid-cols-2 gap-6";

    audioTypes.forEach(type => {
      const fileName = `${currentLessonId}_${type.key}_1.mp3`;
      const filePath = getAudioFile(currentLessonId, type.key);

      const colorMap = {
        blue: "border-blue-200 bg-blue-50 text-blue-700",
        fuchsia: "border-fuchsia-200 bg-fuchsia-50 text-fuchsia-700",
        emerald: "border-emerald-200 bg-emerald-50 text-emerald-700",
        amber: "border-amber-200 bg-amber-50 text-amber-700",
        violet: "border-violet-200 bg-violet-50 text-violet-700"
      };

      const card = document.createElement("div");
      card.className = `audio-card border rounded-3xl p-6 shadow-sm ${completedLessons.includes(currentLessonId) ? "done" : "bg-white border-slate-200"}`;

      card.innerHTML = `
        <div class="flex items-start justify-between gap-4 mb-4">
          <div>
            <div class="inline-flex px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${colorMap[type.color]}">
              ${type.label}
            </div>
            <h3 class="text-xl font-bold text-slate-900 mt-3">${type.label}</h3>
            <p class="text-slate-500 text-sm mt-2 break-all">${fileName}</p>
          </div>
          <div class="text-2xl">🎧</div>
        </div>

        <div class="space-y-3">
          <button class="play-btn w-full px-4 py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-semibold transition">
            ▶ Odtwórz
          </button>

          <audio controls preload="none" class="w-full rounded-xl">
            <source src="${filePath}" type="audio/mpeg">
            Twoja przeglądarka nie obsługuje audio.
          </audio>

          <div class="flex gap-3">
            <a href="${filePath}" target="_blank" class="flex-1 text-center px-4 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold transition">
              Otwórz plik
            </a>
            <button class="copy-btn flex-1 px-4 py-3 rounded-2xl bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-semibold transition">
              Kopiuj nazwę
            </button>
          </div>
        </div>
      `;

      const audio = card.querySelector("audio");
      const playBtn = card.querySelector(".play-btn");
      const copyBtn = card.querySelector(".copy-btn");

      playBtn.addEventListener("click", () => {
        document.getElementById("mainAudioPlayer").src = filePath;
        document.getElementById("mainAudioLabel").innerText = `${currentLessonId} • ${type.label}`;
        document.getElementById("mainAudioPlayer").play().catch(() => {});
      });

      copyBtn.addEventListener("click", () => {
        navigator.clipboard.writeText(fileName);
        copyBtn.innerText = "Skopiowano";
        setTimeout(() => copyBtn.innerText = "Kopiuj nazwę", 1200);
      });

      audio.addEventListener("error", () => {
        if (!card.querySelector(".audio-error")) {
          const errorBox = document.createElement("div");
          errorBox.className = "audio-error mt-3 px-4 py-3 rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 text-sm font-medium";
          errorBox.innerText = "Brak pliku w repozytorium albo błędna nazwa.";
          card.appendChild(errorBox);
        }
      });

      wrapper.appendChild(card);
    });

    return wrapper;
  }

  function renderContent() {
    const container = document.getElementById("contentArea");
    const lessonInfo = courseData[currentLessonId];
    container.innerHTML = "";

    if (currentTab === "lesson") {
      container.innerHTML = renderLessonContent(lessonInfo);
      return;
    }

    if (currentTab === "info") {
      container.innerHTML = renderInfoContent(lessonInfo);
      return;
    }

    container.appendChild(renderAudioContent());
  }

  function prevLesson() {
    const currentIndex = lessonOrder.indexOf(currentLessonId);
    if (currentIndex > 0) {
      loadLesson(lessonOrder[currentIndex - 1]);
    }
  }

  function nextLesson() {
    const currentIndex = lessonOrder.indexOf(currentLessonId);
    if (currentIndex < lessonOrder.length - 1) {
      loadLesson(lessonOrder[currentIndex + 1]);
    }
  }

  function filterLessons() {
    const query = document.getElementById("searchInput").value.trim().toLowerCase();

    if (!query) {
      renderLessonButtons();
      return;
    }

    const container = document.getElementById("lessonButtons");
    container.innerHTML = "";

    lessonOrder
      .filter(id => {
        const lesson = courseData[id];
        return (
          id.toLowerCase().includes(query) ||
          lesson.title.toLowerCase().includes(query) ||
          lesson.description.toLowerCase().includes(query) ||
          lesson.module.toLowerCase().includes(query) ||
          lesson.scope.some(x => x.toLowerCase().includes(query))
        );
      })
      .forEach(lessonId => {
        const isActive = lessonId === currentLessonId;
        const isDone = completedLessons.includes(lessonId);

        const button = document.createElement("button");
        button.className = `lesson-btn px-3 py-3 rounded-2xl border font-semibold text-sm transition ${
          isActive ? "active" : "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100"
        }`;
        button.innerHTML = `${lessonId}${isDone ? " ✓" : ""}`;
        button.onclick = () => loadLesson(lessonId);
        container.appendChild(button);
      });
  }

  updateProgress();
  renderLessonButtons();
  loadLesson("M1L1");
</script>

</body>
</html>
