<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Master | Pełny Kurs M1-M5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .card-flip { perspective: 1000px; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; position: relative; width: 100%; height: 100%; }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { 
            backface-visibility: hidden; position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; 
            padding: 15px; border-radius: 16px; text-align: center; font-size: 1.1rem;
        }
        .card-back { transform: rotateY(180deg); background-color: #2563eb; color: white; font-weight: bold; }
        .card-front { background-color: #f8fafc; border: 2px solid #e2e8f0; color: #1e293b; font-style: italic; }
        .gradient-header { background: linear-gradient(135deg, #1e3a8a 0%, #4338ca 100%); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="gradient-header text-white p-6 shadow-lg sticky top-0 z-50">
    <div class="container mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-3xl font-800 tracking-tighter">ENGLISH MASTER</h1>
            <p class="text-blue-200 text-sm font-semibold uppercase tracking-widest">Moduły 1 - 5 • 30 Lekcji</p>
        </div>
        <div class="flex items-center gap-4">
            <input type="text" id="searchInput" placeholder="Szukaj słówka..." onkeyup="searchVocab()" class="px-4 py-2 rounded-full text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
            <div class="bg-white/10 px-4 py-2 rounded-xl border border-white/20">
                <span class="text-xs block opacity-70">UKOŃCZONO</span>
                <span id="progressCount" class="text-xl font-bold">0</span> <span class="text-sm opacity-70">/ 30</span>
            </div>
        </div>
    </div>
</header>

<main class="container mx-auto p-4 lg:p-8">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <aside class="lg:col-span-1 space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 class="text-sm font-bold text-slate-500 uppercase mb-4 tracking-wider">Twoje Lekcje</h3>
                <select id="lessonSelect" class="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-indigo-500 outline-none transition-all font-medium" onchange="loadLesson()">
                    <optgroup label="MODUŁ 1: Podstawy">
                        <option value="M1L1">L1: Powitania</option>
                        <option value="M1L2">L2: Przedstawianie się</option>
                        <option value="M1L3">L3: Liczby 1-10</option>
                        <option value="M1L4">L4: Kolory</option>
                        <option value="M1L5">L5: Rodzina</option>
                        <option value="M1L6">L6: Samopoczucie</option>
                    </optgroup>
                    <optgroup label="MODUŁ 2: Życie Codzienne">
                        <option value="M2L1">L1: Mój Dom</option>
                        <option value="M2L2">L2: Jedzenie</option>
                        <option value="M2L3">L3: Czas wolny</option>
                        <option value="M2L4">L4: Zawody</option>
                        <option value="M2L5">L5: Zegar i Czas</option>
                        <option value="M2L6">L6: Codzienna Rutyna</option>
                    </optgroup>
                    <optgroup label="MODUŁ 3: Zakupy">
                        <option value="M3L1">L1: Sklep spożywczy</option>
                        <option value="M3L2">L2: Ubrania</option>
                        <option value="M3L3">L3: Liczby 20+ i Ceny</option>
                        <option value="M3L4">L4: Elektronika</option>
                        <option value="M3L5">L5: Płatności</option>
                        <option value="M3L6">L6: Reklamacje</option>
                    </optgroup>
                    <optgroup label="MODUŁ 4: Podróże">
                        <option value="M4L1">L1: Na Lotnisku</option>
                        <option value="M4L2">L2: Rezerwacja Hotelu</option>
                        <option value="M4L3">L3: Pytanie o drogę</option>
                        <option value="M4L4">L4: W Restauracji</option>
                        <option value="M4L5">L5: Atrakcje turystyczne</option>
                        <option value="M4L6">L6: Pomoc w podróży</option>
                    </optgroup>
                    <optgroup label="MODUŁ 5: Zdrowie" selected>
                        <option value="M5L1">L1: Części ciała i Ból</option>
                        <option value="M5L2">L2: Wizyta w aptece</option>
                        <option value="M5L3">L3: U Lekarza</option>
                        <option value="M5L4">L4: Zdrowy Styl Życia</option>
                        <option value="M5L5">L5: Emocje</option>
                        <option value="M5L6">L6: Nagłe Wypadki</option>
                    </optgroup>
                </select>
            </div>

            <div class="bg-indigo-900 text-white p-6 rounded-2xl shadow-lg">
                <h3 class="font-bold mb-4 flex items-center">
                    <span class="mr-2">🎵</span> Centrum Audio
                </h3>
                <div class="space-y-4">
                    <div class="bg-white/10 p-3 rounded-lg">
                        <p class="text-[10px] font-bold opacity-60 mb-1 uppercase">Słownictwo</p>
                        <audio id="audioVocab" controls class="w-full h-8"></audio>
                    </div>
                    <div class="bg-white/10 p-3 rounded-lg">
                        <p class="text-[10px] font-bold opacity-60 mb-1 uppercase">Powtórki / Dialog</p>
                        <audio id="audioRepeat" controls class="w-full h-8"></audio>
                    </div>
                </div>
            </div>
        </aside>

        <section class="lg:col-span-3 space-y-6">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 min-h-[600px]">
                <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8 pb-6 border-b border-slate-100">
                    <div>
                        <span id="lessonTag" class="text-indigo-600 font-bold text-xs uppercase tracking-widest bg-indigo-50 px-3 py-1 rounded-full mb-2 inline-block">Moduł 5</span>
                        <h2 id="lessonTitle" class="text-4xl font-800 text-slate-900">U Lekarza</h2>
                    </div>
                    <button onclick="playCurrentLesson()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-2xl font-bold transition-all transform hover:scale-105 shadow-md">
                        ▶ Odtwórz Lekcję
                    </button>
                </div>

                <div id="contentArea" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
                    </div>
            </div>
        </section>
    </div>
</main>

<script>
    const lessonsData = {
        // M1
        "M1L1": { title: "Powitania", tag: "Moduł 1", vocab: ["Hello - Cześć", "Good morning - Dzień dobry", "Goodbye - Do widzenia", "How are you? - Jak się masz?"], files: {v: "M1L1_Vocabulary_1.mp3", r: "M1L1_Repeat_1.mp3"} },
        "M1L2": { title: "Przedstawianie się", tag: "Moduł 1", vocab: ["Name - Imię", "Nice to meet you - Miło Cię poznać", "I am... - Jestem...", "Friend - Przyjaciel"], files: {v: "M1L2_Vocabulary_1.mp3", r: "M1L2_Repeat_1.mp3"} },
        "M1L3": { title: "Liczby 1-10", tag: "Moduł 1", vocab: ["One - Jeden", "Five - Pięć", "Seven - Siedem", "Ten - Dziesięć"], files: {v: "M1L3_Vocabulary_1.mp3", r: "M1L3_Repeat_1.mp3"} },
        "M1L4": { title: "Kolory", tag: "Moduł 1", vocab: ["Red - Czerwony", "Blue - Niebieski", "Green - Zielony", "Yellow - Żółty"], files: {v: "M1L4_Vocabulary_1.mp3", r: "M1L4_Repeat_1.mp3"} },
        "M1L5": { title: "Rodzina", tag: "Moduł 1", vocab: ["Mother - Matka", "Father - Ojciec", "Brother - Brat", "Sister - Siostra"], files: {v: "M1L5_Vocabulary_1.mp3", r: "M1L5_Repeat_1.mp3"} },
        "M1L6": { title: "Samopoczucie", tag: "Moduł 1", vocab: ["Happy - Szczęśliwy", "Sad - Smutny", "Tired - Zmęczony", "Fine - Dobrze"], files: {v: "M1L6_Vocabulary_1.mp3", r: "M1L6_Repeat_1.mp3"} },
        
        // M2
        "M2L1": { title: "Mój Dom", tag: "Moduł 2", vocab: ["House - Dom", "Kitchen - Kuchnia", "Bedroom - Sypialnia", "Bed - Łóżko"], files: {v: "M2L1_Vocabulary_1.mp3", r: "M2L1_Repeat_1.mp3"} },
        "M2L2": { title: "Jedzenie", tag: "Moduł 2", vocab: ["Bread - Chleb", "Water - Woda", "Apple - Jabłko", "Tea - Herbata"], files: {v: "M2L2_Vocabulary_1.mp3", r: "M2L2_Repeat_1.mp3"} },
        "M2L3": { title: "Czas wolny", tag: "Moduł 2", vocab: ["Book - Książka", "Music - Muzyka", "Sport - Sport", "Dance - Taniec"], files: {v: "M2L3_Vocabulary_1.mp3", r: "M2L3_Repeat_1.mp3"} },
        "M2L4": { title: "Zawody", tag: "Moduł 2", vocab: ["Teacher - Nauczyciel", "Doctor - Lekarz", "Office - Biuro", "Student - Uczeń"], files: {v: "M2L4_Vocabulary_1.mp3", r: "M2L4_Repeat_1.mp3"} },
        "M2L5": { title: "Zegar i Czas", tag: "Moduł 2", vocab: ["Time - Czas", "Clock - Zegar", "Morning - Rano", "Night - Noc"], files: {v: "M2L5_Vocabulary_1.mp3", r: "M2L5_Repeat_1.mp3"} },
        "M2L6": { title: "Codzienna Rutyna", tag: "Moduł 2", vocab: ["Wake up - Budzić się", "Shower - Prysznic", "Dinner - Obiad", "Go to bed - Iść spać"], files: {v: "M2L6_Vocabulary_1.mp3", r: "M2L6_Repeat_1.mp3"} },

        // M3
        "M3L1": { title: "Sklep spożywczy", tag: "Moduł 3", vocab: ["Milk - Mleko", "Eggs - Jajka", "Cheese - Ser", "Shop - Sklep"], files: {v: "M3L1_Vocabulary_1.mp3", r: "M3L1_Repeat_1.mp3"} },
        "M3L2": { title: "Ubrania", tag: "Moduł 3", vocab: ["Shirt - Koszula", "Trousers - Spodnie", "Shoes - Buty", "Jacket - Kurtka"], files: {v: "M3L2_Vocabulary_1.mp3", r: "M3L2_Repeat_1.mp3"} },
        "M3L3": { title: "Liczby i Ceny", tag: "Moduł 3", vocab: ["Price - Cena", "Twenty - Dwadzieścia", "Fifty - Pięćdziesiąt", "Pounds - Funty"], files: {v: "M3L3_Vocabulary_1.mp3", r: "M3L3_Repeat_1.mp3"} },
        "M3L4": { title: "Elektronika", tag: "Moduł 3", vocab: ["Phone - Telefon", "Charger - Ładowarka", "Laptop - Komputer", "Broken - Zepsuty"], files: {v: "M3L4_Vocabulary_1.mp3", r: "M3L4_Repeat_1.mp3"} },
        "M3L5": { title: "Płatności", tag: "Moduł 3", vocab: ["Cash - Gotówka", "Card - Karta", "PIN - PIN", "Receipt - Paragon"], files: {v: "M3L5_Vocabulary_1.mp3", r: "M3L5_Repeat_1.mp3"} },
        "M3L6": { title: "Reklamacje", tag: "Moduł 3", vocab: ["Refund - Zwrot", "Manager - Manager", "Help - Pomoc", "Exchange - Wymiana"], files: {v: "M3L6_Vocabulary_1.mp3", r: "M3L6_Repeat_1.mp3"} },

        // M4
        "M4L1": { title: "Na Lotnisku", tag: "Moduł 4", vocab: ["Passport - Paszport", "Ticket - Bilet", "Gate - Bramka", "Flight - Lot"], files: {v: "M4L1_Vocabulary_1.mp3", r: "M4L1_Repeat_1.mp3"} },
        "M4L2": { title: "W Hotelu", tag: "Moduł 4", vocab: ["Room - Pokój", "Key - Klucz", "Check-in - Meldunek", "Reservation - Rezerwacja"], files: {v: "M4L2_Vocabulary_1.mp3", r: "M4L2_Repeat_1.mp3"} },
        "M4L3": { title: "Transport", tag: "Moduł 4", vocab: ["Bus - Autobus", "Station - Stacja", "Map - Mapa", "Straight - Prosto"], files: {v: "M4L3_Vocabulary_1.mp3", r: "M4L3_Repeat_1.mp3"} },
        "M4L4": { title: "W Restauracji", tag: "Moduł 4", vocab: ["Menu - Menu", "Table - Stolik", "Bill - Rachunek", "Order - Zamówienie"], files: {v: "M4L4_Vocabulary_1.mp3", r: "M4L4_Repeat_1.mp3"} },
        "M4L5": { title: "Atrakcje", tag: "Moduł 4", vocab: ["Museum - Muzeum", "Park - Park", "Beach - Plaża", "Open - Otwarte"], files: {v: "M4L5_Vocabulary_1.mp3", r: "M4L5_Repeat_1.mp3"} },
        "M4L6": { title: "Pomoc", tag: "Moduł 4", vocab: ["Help - Pomocy", "Police - Policja", "Lost - Zgubiony", "Safe - Bezpieczny"], files: {v: "M4L6_Vocabulary_1.mp3", r: "M4L6_Repeat_1.mp3"} },

        // M5
        "M5L1": { title: "Części Ciała", tag: "Moduł 5", vocab: ["Head - Głowa", "Back - Plecy", "Arm - Ramię", "Pain - Ból"], files: {v: "M5L1_Vocabulary_1.mp3", r: "M5L1_Repeat_1.mp3"} },
        "M5L2": { title: "W Aptece", tag: "Moduł 5", vocab: ["Medicine - Lek", "Painkiller - Przeciwbólowy", "Syrup - Syrop", "Cough - Kaszel"], files: {v: "M5L2_Vocabulary_1.mp3", r: "M5L2_Repeat_1.mp3"} },
        "M5L3": { title: "U Lekarza", tag: "Moduł 5", vocab: ["Doctor - Lekarz", "Fever - Gorączka", "Rest - Odpoczynek", "Prescription - Recepta"], files: {v: "M5L3_Vocabulary_1.mp3", r: "M5L3_Repeat_1.mp3"} },
        "M5L4": { title: "Zdrowy Styl Życia", tag: "Moduł 5", vocab: ["Healthy - Zdrowy", "Exercise - Ćwiczyć", "Water - Woda", "Sport - Sport"], files: {v: "M5L4_Vocabulary_1.mp3", r: "M5L4_Repeat_1.mp3"} },
        "M5L5": { title: "Emocje", tag: "Moduł 5", vocab: ["Happy - Szczęśliwy", "Sad - Smutny", "Stressed - Zestresowany", "Tired - Zmęczony"], files: {v: "M5L5_Vocabulary_1.mp3", r: "M5L5_Repeat_1.mp3"} },
        "M5L6": { title: "Nagłe Wypadki", tag: "Moduł 5", vocab: ["Accident - Wypadek", "Ambulance - Karetka", "Blood - Krew", "Call - Dzwonić"], files: {v: "M5L6_Vocabulary_1.mp3", r: "M5L6_Repeat_1.mp3"} },
    };

    let completed = new Set();

    function loadLesson() {
        const id = document.getElementById('lessonSelect').value;
        const data = lessonsData[id];
        
        document.getElementById('lessonTitle').innerText = data.title;
        document.getElementById('lessonTag').innerText = data.tag;
        document.getElementById('audioVocab').src = data.files.v;
        document.getElementById('audioRepeat').src = data.files.r;

        renderVocab(data.vocab, id);
    }

    function renderVocab(vocabArray, lessonId) {
        const container = document.getElementById('contentArea');
        container.innerHTML = '';
        vocabArray.forEach(item => {
            const [en, pl] = item.split(' - ');
            container.innerHTML += `
                <div class="card-flip h-32">
                    <div class="card-inner" onclick="this.classList.toggle('flipped'); trackProgress('${lessonId}')">
                        <div class="card-front font-semibold">${en}</div>
                        <div class="card-back">${pl}</div>
                    </div>
                </div>
            `;
        });
    }

    function trackProgress(id) {
        completed.add(id);
        document.getElementById('progressCount').innerText = completed.size;
    }

    function playCurrentLesson() {
        document.getElementById('audioVocab').play();
    }

    function searchVocab() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const results = [];
        Object.values(lessonsData).forEach(l => {
            l.vocab.forEach(v => {
                if(v.toLowerCase().includes(query)) results.push(v);
            });
        });
        if(query.length > 1) {
            document.getElementById('lessonTitle').innerText = "Wyniki wyszukiwania";
            renderVocab(results, 'search');
        } else {
            loadLesson();
        }
    }

    window.onload = loadLesson;
</script>
</body>
</html>
